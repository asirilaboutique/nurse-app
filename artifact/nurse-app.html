<title>Nurse App</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B3A4B;--sage:#8BA888;--blush:#E8D5C4;--amber:#C4935A;--bg:#FBF8F4;--line:#E9E1D7;--mut:#5A6B74;--ok:#2F5A3C;--okbg:#DDE8DA;--okfg:#234B31;--warnbg:#F4E6D2;--warnfg:#5E3E17;--badbg:#F3DDD6;--badfg:#7A2F1F;--bad:#A4452F;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:18px 18px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
#app.wide{max-width:1280px}
#app.portal{background:#F6EFE8;max-width:520px;padding-top:26px;line-height:1.6}#app.portal .col{gap:16px}#app.portal h1{font-size:40px}#app.portal .card,#app.portal .paper{padding:18px}#app.portal .navy{padding:22px}
.pfoot{margin-top:22px;text-align:center;font-size:12px;color:var(--mut)}.pfoot b{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--navy)}
h1,h2{font-family:'Cormorant Garamond',serif;margin:0;line-height:1.05}
h1{font-size:32px;font-weight:700}h2{font-size:24px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.navy{background:var(--navy);color:var(--blush);border-radius:20px;padding:16px 18px}
.navy b.big{font-family:'Cormorant Garamond',serif;font-size:32px;color:#fff;line-height:1;display:block}
.btn{min-height:46px;border:0;border-radius:14px;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ok);color:#fff;text-align:center}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--navy);font-weight:500}
.btn.amb{background:var(--amber);color:#10293A}
.btn.sage{background:var(--okbg);color:var(--okfg)}
.btn.bad{background:var(--badbg);color:var(--badfg)}
.btn.full{width:100%}.btn.sm{min-height:44px;font-size:13px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.p-warn{background:var(--warnbg);color:var(--warnfg)}.p-ok{background:var(--okbg);color:var(--okfg)}.p-bad{background:var(--badbg);color:var(--badfg)}.p-mut{background:#EFE7DC;color:var(--mut)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--mut)}
input,select,textarea{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;width:100%;font-size:15px}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;gap:2px;background:#EFE7DC;border-radius:14px;padding:3px}
.seg button{flex:1;min-width:48px;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--mut)}
nav.tabs a.on{color:var(--navy);font-weight:700}
nav.tabs svg{width:24px;height:24px}
.sheetbg{position:fixed;inset:0;background:rgba(27,58,75,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:60;max-width:90vw}
.alert{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4}
.a-warn{background:var(--warnbg);color:var(--warnfg)}.a-bad{background:var(--badbg);color:var(--badfg)}.a-ok{background:var(--okbg);color:var(--okfg)}
.apt{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.apt .t{width:52px;flex:none}
.gap{font-size:12px;color:var(--mut);padding:2px 0 2px 64px}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kan>div{min-width:230px;flex:1;background:#F3EDE4;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:5px;background:#EFE7DC}.bar i{display:block;height:10px;border-radius:5px;background:var(--navy)}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px;font-size:13px;line-height:1.5}
.paper table{width:100%;border-collapse:collapse}.paper td,.paper th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.card916{aspect-ratio:9/16;width:100%;max-width:320px;background:var(--navy);color:var(--blush);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;margin:0 auto;position:relative;overflow:hidden}
.card916.v-blush{background:var(--blush);color:var(--navy)}.card916.v-blush .dl{border-color:#C9B29C!important}.card916.v-blush .dt{color:var(--navy)!important}.card916.v-blush .dk{color:#7A5A2E!important}.card916.v-blush .dh{color:var(--navy)!important}.card916.v-blush .dh i{color:#7A5A2E!important}
.card916.v-foto{background-size:cover;background-position:center;color:#fff}.card916.v-foto:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(16,41,58,.78),rgba(16,41,58,.62) 40%,rgba(16,41,58,.9))}.card916.v-foto>*{position:relative}
.demo{background:var(--warnbg);color:var(--warnfg)}
@media(min-width:900px){#app{padding-bottom:40px}nav.tabs{max-width:560px}}
@media print{nav.tabs,.noprint,.sheetbg,.toast{display:none!important}#app{max-width:none;padding:0}body{background:#fff}}
.hide{display:none!important}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:99}
</style>

<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clp=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-CL');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return (h||0)*60+(m||0)};
const hhmm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fdate=(s,long)=>{const d=pISO(s);return (long?cap(DIAS[d.getDay()])+' ':DIAS3[d.getDay()]+' ')+d.getDate()+(long?' de '+MESES[d.getMonth()]:' '+MESES[d.getMonth()].slice(0,3))};
const addDays=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const dur=m=>m>=60?(Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'')):m+' min';
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const digits=s=>String(s||'').replace(/\D/g,'');
function waLink(phone,text){let p=digits(phone);if(p.length===9&&p[0]==='9')p='56'+p;else if(p.length===8)p='569'+p;return 'https://wa.me/'+p+'?text='+encodeURIComponent(text)}
const sha=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24)}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return String(h)}};
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));

/* ============ estado ============ */
const KEY='nurseapp.v1';
const DEFAULTS=()=>({v:1,profile:{name:'Valeria Inzunza',role:'Enfermera · cuidados domiciliarios',reg:'475283',rut:'',wa:'',email:'',bank:'',holder:'',ig:'@valeria.inzunza.enfermera',tagline:'Cuidados que acompañan. En cada etapa de la vida.',meta:800000},
 tarifas:{visita:18000,turnoHora:13500,pack:15000,traslado:0},
 horario:{ini:'08:00',fin:'20:00',almIni:'13:00',almFin:'14:00',margen:15,dias:[1,2,3,4,5,6]},
 patients:[],appts:[],quotes:[],charges:[],leads:[],counters:{quote:12,boleta:0},ui:{}});
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=DEFAULTS();return Object.assign(d,o,{profile:Object.assign(d.profile,o.profile,{reg:(o.profile&&o.profile.reg)||d.profile.reg}),tarifas:Object.assign(d.tarifas,o.tarifas),horario:Object.assign(d.horario,o.horario)})}}catch(e){console.warn('load',e)}return DEFAULTS()}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,150)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('No hay espacio para guardar. Exporta un respaldo y borra fotos.');return false}}
window.addEventListener('pagehide',saveNow);
const P=id=>S.patients.find(p=>p.id===id);
const A=id=>S.appts.find(a=>a.id===id);
const Q=id=>S.quotes.find(q=>q.id===id);

/* ============ agenda: choques y huecos ============ */
const BUSY=a=>a.status!=='cancel';
function span(a){return [toMin(a.start)-(a.travel||0),toMin(a.start)+a.dur]}
function conflicts(date,start,durMin,travel,ignoreId){
 const s=toMin(start)-(travel||0),e=toMin(start)+durMin;
 return S.appts.filter(a=>a.date===date&&BUSY(a)&&a.id!==ignoreId).filter(a=>{const [x,y]=span(a);return s<y&&e>x});
}
function lunchClash(start,durMin){const s=toMin(start),e=s+durMin,a=toMin(S.horario.almIni),b=toMin(S.horario.almFin);return a<b&&s<b&&e>a}
function workDay(date){return S.horario.dias.includes(pISO(date).getDay())}
function suggest(date,durMin,travel,n,fromMin,ignoreId){
 const out=[];const ini=toMin(S.horario.ini),fin=toMin(S.horario.fin);
 for(let d=0;d<10&&out.length<n;d++){
  const day=addDays(date,d);if(!workDay(day))continue;
  let t=d===0&&fromMin!=null?Math.max(ini,Math.ceil(fromMin/15)*15):ini;
  for(;t+durMin<=fin&&out.length<n;t+=15){
   if(day===today()&&t<=nowMin())continue;
   const st=hhmm(t);
   if(!conflicts(day,st,durMin,travel,ignoreId).length&&!lunchClash(st,durMin)){out.push({date:day,start:st});t+=Math.max(durMin-15,0)}
  }
 }
 return out;
}
function loadOf(date){const m=S.appts.filter(a=>a.date===date&&BUSY(a)).reduce((s,a)=>s+a.dur+(a.travel||0),0);return m>=360?'alta':m>=180?'media':m>0?'baja':'libre'}
const loadColor={libre:'#E9E1D7',baja:'#8BA888',media:'#C4935A',alta:'#A4452F'};
function dayAppts(date){return S.appts.filter(a=>a.date===date&&BUSY(a)).sort((a,b)=>toMin(a.start)-toMin(b.start))}
function freeWindows(date){
 if(!workDay(date))return [];
 const ini=toMin(S.horario.ini),fin=toMin(S.horario.fin);
 let busy=dayAppts(date).map(span);
 const a=toMin(S.horario.almIni),b=toMin(S.horario.almFin);if(a<b)busy.push([a,b]);
 busy.sort((x,y)=>x[0]-y[0]);
 const out=[];let cur=ini;
 for(const [s,e] of busy){if(s-cur>=60)out.push([cur,Math.min(s,fin)]);cur=Math.max(cur,e)}
 if(fin-cur>=60)out.push([cur,fin]);
 return out;
}

/* ============ datos de ejemplo ============ */
function demo(){
 const t=today(),d=n=>addDays(t,n);
 const mk=(o)=>Object.assign({id:uid()},o);
 const rosa=mk({name:'Rosa Contreras',age:58,zone:'Talca Norte',phase:'tratamiento',phone:'',resp:{name:'Camila Contreras',rel:'hija',phone:'+56 9 1234 4821'},consent:{date:d(-5)},indication:{text:'Anticoagulante · 7 días',date:d(-5)},risks:['Sangrado','Caídas: bajo'],source:'Derivación médica',pin:'',notes:''});
 const mateo=mk({name:'Mateo, 8 meses',age:1,zone:'Sector Oriente',phase:'tratamiento',phone:'',resp:{name:'Pamela Rojas',rel:'madre',phone:'+56 9 5555 0101'},consent:{date:d(-10)},indication:{text:'',date:''},risks:[],source:'Instagram',pin:'',notes:'Turno por horas lun · mié · vie'});
 const hern=mk({name:'Hernán Soto',age:74,zone:'Talca Sur',phase:'cobro',phone:'',resp:{name:'Hernán Soto',rel:'paciente',phone:'+56 9 5555 0202'},consent:{date:d(-30)},indication:{text:'Curaciones · 10 días',date:d(-30)},risks:['Infección herida'],source:'Derivación médica',pin:'',notes:''});
 const elena=mk({name:'Elena Vidal',age:81,zone:'Talca Centro',phase:'cobro',phone:'',resp:{name:'Elena Vidal',rel:'paciente',phone:'+56 9 5555 0303'},consent:null,indication:{text:'',date:''},risks:['Caídas: medio'],source:'Recomendación',pin:'',notes:''});
 S.patients=[rosa,mateo,hern,elena];
 const ap=(p,dt,st,du,ty,tr,status,price)=>mk({patientId:p.id,date:dt,start:st,dur:du,type:ty,travel:tr,status,price,record:null,report:null,zone:p.zone});
 S.appts=[
  ap(rosa,d(-3),'08:30',30,'Inyección anticoagulante · día 1',12,'hecha',18000),
  ap(rosa,d(-2),'08:30',30,'Inyección anticoagulante · día 2',12,'hecha',18000),
  ap(rosa,d(-1),'08:30',30,'Inyección anticoagulante · día 3',12,'hecha',18000),
  ap(rosa,t,'08:30',30,'Inyección anticoagulante · día 4',12,'prog',18000),
  ap(mateo,t,'10:00',180,'Cuidado de bebé · turno por horas',20,'prog',40500),
  ap(hern,t,'13:30',30,'Curación · visita de procedimiento',30,'prog',18000),
  ap(rosa,d(1),'08:30',30,'Inyección anticoagulante · día 5',12,'prog',18000),
  ap(rosa,d(2),'08:30',30,'Inyección anticoagulante · día 6',12,'prog',18000),
  ap(rosa,d(3),'08:30',30,'Inyección anticoagulante · día 7',12,'prog',18000),
  ap(mateo,d(2),'10:00',180,'Cuidado de bebé · turno por horas',20,'prog',40500),
 ];
 S.appts.slice(0,3).forEach((a,i)=>{a.record={start:a.date+'T08:34',end:a.date+'T09:04',sitio:i%2?'Abdomen izq.':'Abdomen der.',farmaco:'Anticoagulante',dosis:'según indicación',vit:{pa:'120/78',fc:'72',temp:'36.5',sat:'97'},vig:['Sin sangrado','Sin dolor'],nota:''};a.report={family:'Hoy visité a la Sra. Rosa para su inyección anticoagulante. Se aplicó sin inconvenientes, sin sangrado ni dolor.',clinical:'',approved:true,sent:true}});
 S.quotes=[mk({n:'0012',patientId:rosa.id,resp:'Camila Contreras',modo:'Visita de procedimiento',servicio:'Tratamiento inyectable domiciliario · 7 días',qty:7,unit:18000,disc:0,zone:'Talca Norte',valid:7,status:'aceptada',date:d(-5),slots:[]})];
 S.charges=[
  mk({patientId:hern.id,concept:'Boleta N° 126 · 10 curaciones',amount:90000,due:d(-5),status:'pend',boleta:'126'}),
  mk({patientId:elena.id,concept:'Boleta N° 128 · turno de 4 h',amount:54000,due:d(2),status:'pend',boleta:'128'}),
  mk({patientId:rosa.id,concept:'Tratamiento 7 días · cotización 0012',amount:126000,due:d(2),status:'pend',boleta:''}),
  mk({patientId:mateo.id,concept:'Turno 3 h · semana pasada',amount:40500,due:d(-6),status:'pagado',boleta:'124',paidAt:d(-4)}),
  mk({patientId:hern.id,concept:'Curaciones previas',amount:180000,due:d(-12),status:'pagado',boleta:'120',paidAt:d(-9)}),
  mk({patientId:elena.id,concept:'Turno 4 h',amount:54000,due:d(-3),status:'pagado',boleta:'125',paidAt:d(-2)}),
 ];
 S.leads=[
  mk({name:'Familia Vera',need:'Adulto mayor · compañía',source:'Instagram',stage:0,amount:0,note:'Hoy'}),
  mk({name:'Pamela Rojas',need:'Bebé · 3 meses',source:'WhatsApp',stage:0,amount:0,note:'Ayer'}),
  mk({name:'Luis Parra',need:'Paliativo · 4 h al día',source:'Derivación médica',stage:1,amount:480000,note:'Vista por la familia'}),
  mk({name:'Familia Núñez',need:'Turno nocturno',source:'Recomendación',stage:1,amount:90000,note:'Sin respuesta hace 3 días'}),
  mk({name:'Familia Pino',need:'Curaciones · 10 días',source:'Derivación médica',stage:2,amount:180000,note:'Falta agendar las horas'}),
  mk({name:'Rosa Contreras',need:'Inyecciones · día 4 de 7',source:'Derivación médica',stage:3,amount:126000,note:'',patientId:rosa.id}),
  mk({name:'Elena Vidal',need:'Boleta N° 128',source:'Recomendación',stage:4,amount:54000,note:'Vence en 2 días',patientId:elena.id}),
  mk({name:'Marta Díaz',need:'Alta hace 7 días',source:'Instagram',stage:5,amount:0,note:'Preguntar cómo sigue'}),
 ];
 S.counters={quote:12,boleta:128};S.demo=true;
 save();
}
const STAGES=['Consulta','Cotización enviada','Aceptada','En tratamiento','Boleta y cobro','Seguimiento'];

/* ============ UI base ============ */
const ICON={
 hoy:'<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
 agenda:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
 pac:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>',
 cobros:'<rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/>',
 cot:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
 mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'
};
const LOGO=(sz,light)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" role="img" aria-label="Valeria Enfermera" style="flex:none"><circle cx="32" cy="32" r="32" fill="${light?'#E8D5C4':'#1B3A4B'}"/><circle cx="32" cy="32" r="24" fill="none" stroke="${light?'#1B3A4B':'#E8D5C4'}" stroke-width="2"/><path d="M32 19v26M19 32h26" stroke="#C4935A" stroke-width="7" stroke-linecap="round"/><path d="M33 19c8 0 12 5 12 10-7 0-12-3-12-10z" fill="#8BA888"/></svg>`;
const svg=(k,sz)=>`<svg width="${sz||24}" height="${sz||24}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const NATIVE_CONFIRM=window.confirm;
function ask(msg){
 if(window.confirm!==NATIVE_CONFIRM)return Promise.resolve(window.confirm(msg)); // pruebas automáticas
 return new Promise(res=>{
  const b=document.createElement('div');b.className='sheetbg';b.style.zIndex=80;b.style.alignItems='center';b.style.padding='18px';
  b.innerHTML='<div class="card col" role="alertdialog" aria-modal="true" aria-label="Confirmar" style="max-width:420px;width:100%;padding:20px"><p style="margin:0;line-height:1.5">'+esc(msg)+'</p><div class="row"><button class="btn grow" id="askok">Sí, continuar</button><button class="btn sec grow" id="askno">Cancelar</button></div></div>';
  const done=v=>{b.remove();res(v)};
  document.body.appendChild(b);
  b.querySelector('#askok').onclick=()=>done(true);b.querySelector('#askno').onclick=()=>done(false);
  b.addEventListener('keydown',e=>{if(e.key==='Escape')done(false)});b.querySelector('#askno').focus();
 });
}

/* ============ VOZ / FRASE ============ */
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function parsePhrase(txt){
 const raw=txt.trim();const n=norm(raw);const out={ok:false,notes:[],raw};
 // paciente
 const words=n.replace(/\b(don|dona|doña|sr|sra|senor|senora|a|el|la|los|las|de|del)\b/g,' ').split(/[^a-z0-9]+/).filter(w=>w.length>2);
 let best=null,bs=0;
 S.patients.forEach(p=>{const pn=norm(p.name).split(/[^a-z0-9]+/).filter(w=>w.length>2);const sc=pn.filter(w=>words.includes(w)).length;if(sc>bs){bs=sc;best=p}});
 out.patient=best;
 // fecha
 let date=null;const t=today();
 if(/\bpasado manana\b/.test(n))date=addDays(t,2);
 else if(/\bmanana\b/.test(n)&&!/\bde la manana\b/.test(n)||/\bmanana\b/.test(n)&&/\bagenda|agendar|para manana|manana a|manana en\b/.test(n))date=addDays(t,1);
 else if(/\bhoy\b/.test(n))date=t;
 else{
  const wd=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  for(let i=0;i<7;i++){if(new RegExp('\\b'+wd[i]+'\\b').test(n)){const cur=new Date().getDay();let diff=(i-cur+7)%7;if(diff===0)diff=7;date=addDays(t,diff);break}}
  const m=n.match(/\b(\d{1,2})\s*(?:de\s+)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/);
  if(m){const mi=MESES.indexOf(m[2]);let y=new Date().getFullYear();let dd=new Date(y,mi,Number(m[1]));if(iso(dd)<t)dd=new Date(y+1,mi,Number(m[1]));date=iso(dd)}
 }
 out.date=date;
 // hora
 let time=null;
 let m=n.match(/\b(?:a las|a la|las)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(?:horas|hrs|h)?\s*(am|pm|de la manana|de la tarde|de la noche)?/);
 if(!m)m=n.match(/\b(\d{1,2})[:.](\d{2})\b/);
 if(m){let h=Number(m[1]);const mi=Number(m[2]||0);const ap=m[3]||'';
  if(/pm|tarde|noche/.test(ap)&&h<12)h+=12;
  else if(!ap&&h>=1&&h<=7)h+=12; // "a las 3" en jornada = tarde
  if(h<24&&mi<60)time=pad(h)+':'+pad(mi)}
 out.time=time;
 // duración
 let d=null;const dm=n.match(/(\d+(?:[.,]\d+)?)\s*(horas?|hrs?|h)\b/)||n.match(/(\d+)\s*(minutos?|min)\b/);
 if(dm){const v=Number(dm[1].replace(',','.'));d=/^h/.test(dm[2])?Math.round(v*60):v}
 else if(/\bmedia hora\b/.test(n))d=30;else if(/\buna hora\b/.test(n))d=60;
 // tipo
 let type='Visita',price=S.tarifas.visita,defd=30;
 if(/curaci/.test(n)){type='Visita · curación';defd=30}
 else if(/inyecc|anticoag|enoxa/.test(n)){type='Visita · inyección';defd=30}
 else if(/turno|cuidado|acompan|noche|bebe/.test(n)){type='Turno por horas';defd=180}
 else if(/control|signos|presion/.test(n)){type='Visita · control de signos';defd=30}
 const turno=/turno/i.test(type);
 if(d==null){d=defd;out.notes.push('No dijiste la duración. Usé '+dur(d)+(turno?'':', que es lo habitual en visitas')+'. Cámbialo si no corresponde.')}
 price=turno?Math.round(S.tarifas.turnoHora*d/60):S.tarifas.visita;
 out.type=type;out.dur=d;out.price=price;out.travel=best?20:20;
 if(!best)out.notes.push('No reconocí a la paciente. Elígela de la lista.');

function vitWarn(f){
 const g=n=>f.elements[n]?.value||'';const w=[];
 const [s,d]=g('pa').split('/').map(Number);
 if(s&&(s>=180||s<90))w.push('Presión fuera de rango habitual');if(d&&d>=110)w.push('Diastólica alta');
 if(g('fc')&&(Number(g('fc'))>110||Number(g('fc'))<50))w.push('Pulso fuera de rango');

function genFamily(a,p,r){
 const first=p.name.split(/[ ,]/)[0];const trat=/Sra|Sr/.test('')?'':'';
 const inj=/inyecc|anticoag/i.test(a.type);
 const bits=[];
 const vig=r.vig||[];
 const dia=a.type.match(/día (\d+)/i);
 bits.push(`Hoy visité a ${esc2(first)}${inj?' para su inyección'+(r.farmaco?' de '+r.farmaco.toLowerCase():''):' por: '+a.type.toLowerCase()}${dia?', día '+dia[1]:''}.`);
 if(inj&&r.sitio)bits.push(`Se aplicó en ${r.sitio.toLowerCase()}${vig.includes('Hematoma en sitio')?', con un pequeño hematoma en el sitio':', sin inconvenientes'}.`);
 const pos=[];if(vig.includes('Sin sangrado'))pos.push('sin sangrado');if(vig.includes('Sin dolor'))pos.push('sin dolor');
 if(pos.length)bits.push('Estuvo '+pos.join(' y ')+'.');
 const v=r.vit||{};if(v.pa||v.fc||v.temp||v.sat)bits.push('Los signos vitales fueron controlados y quedaron registrados.');
 if(r.nota)bits.push(r.nota.trim().replace(/\s+/g,' ').replace(/^./,c=>c.toUpperCase()).replace(/([^.!?])$/,'$1.'));
 const nxt=S.appts.filter(x=>x.patientId===a.patientId&&x.status==='prog'&&(x.date+x.start)>(a.date+a.start)).sort((x,y)=>(x.date+x.start).localeCompare(y.date+y.start))[0];
 const obs=`Avísame si aparece sangrado, dolor intenso o algo que te preocupe.${nxt?' Nos vemos '+fdate(nxt.date,true).toLowerCase()+' a las '+nxt.start+'.':''}`;
 return {texto:bits.join(' '),obs};
}
const esc2=s=>s;
function genClinical(a,p,r){
 const v=r.vit||{};
 return `${fdate(a.date,true)} ${a.start}. ${a.type}. ${r.farmaco?'Fármaco: '+r.farmaco+(r.dosis?' ('+r.dosis+')':'')+'. ':''}${r.sitio?'Sitio: '+r.sitio+'. ':''}SV: PA ${v.pa||'—'} · FC ${v.fc||'—'} · T° ${v.temp||'—'} · SatO₂ ${v.sat||'—'}. Vigilancia: ${(r.vig||[]).join(', ')||'sin hallazgos registrados'}. ${r.nota||''}`.trim();
}
function closeVisit(f){
 const a=A(f.dataset.id),p=P(a.patientId);const fd=new FormData(f);
 const r=a.record||{};
 r.farmaco=fd.get('farmaco')||'';r.dosis=fd.get('dosis')||'';r.sitio=fd.get('sitio')||'';
 r.vit={pa:fd.get('pa')||'',fc:fd.get('fc')||'',temp:fd.get('temp')||'',sat:fd.get('sat')||''};
 r.vig=fd.getAll('vig');r.nota=fd.get('nota')||'';r.end=new Date().toISOString();
 a.record=r;a.status='hecha';

 a.report={family:g.texto,obs:g.obs,clinical:genClinical(a,p,r),approved:false,sent:false};
 save();toast('Visita cerrada');location.hash='#/informe/'+a.id;
}

function tentSlots(d){
 const out=[];let day=d.startDate||addDays(today(),1);const n=Math.min(Number(d.qty)||0,14);
 for(let i=0;i<40&&out.length<n;i++,day=addDays(day,1)){
  if(!workDay(day))continue;

 }
 return out;
}

routes.panel=()=>{
 const t=today(),m=t.slice(0,7);
 const paid=S.charges.filter(c=>c.status==='pagado'&&(c.paidAt||c.due).startsWith(m));
 const ing=paid.reduce((s,c)=>s+c.amount,0);
 const meta=S.profile.meta||1;
 const qs=S.quotes.filter(q=>q.status!=='borrador');const acc=qs.filter(q=>q.status==='aceptada').length;
 const tasa=qs.length?Math.round(acc/qs.length*100):0;
 const done=S.appts.filter(a=>a.status==='hecha'&&a.date.startsWith(m));
 const horasT=done.reduce((s,a)=>s+a.dur+(a.travel||0),0)/60;
 const vph=horasT?Math.round(done.reduce((s,a)=>s+(a.price||0),0)/horasT):0;
 // ocupación: horas agendadas del mes / horas disponibles hasta fin de mes
 let disp=0,vend=0;const d0=pISO(m+'-01');const dim=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
 for(let i=1;i<=dim;i++){const dt=m+'-'+pad(i);if(!workDay(dt))continue;disp+=(toMin(S.horario.fin)-toMin(S.horario.ini))-Math.max(0,toMin(S.horario.almFin)-toMin(S.horario.almIni));vend+=dayAppts(dt).reduce((s,a)=>s+a.dur,0)}
 const ocup=disp?Math.round(vend/disp*100):0;
 const wk=[0,0,0,0].map(()=>({p:0,c:0}));
 S.charges.filter(c=>(c.paidAt||c.due).startsWith(m)).forEach(c=>{const day=Number((c.paidAt||c.due).slice(8));const w=Math.min(3,Math.floor((day-1)/7));c.status==='pagado'?wk[w].p+=c.amount:wk[w].c+=c.amount});
 const mx=Math.max(1,...wk.map(w=>w.p+w.c));
 const srcs={};S.patients.forEach(p=>srcs[p.source||'Otro']=(srcs[p.source||'Otro']||0)+1);
 const smax=Math.max(1,...Object.values(srcs));
 const alerts=[];
 const old=S.leads.filter(l=>l.stage===1&&/sin respuesta/i.test(l.note||'')).length;
 if(old)alerts.push(['bad',`${old} cotización sin respuesta`,'Tienes el seguimiento listo para enviar.']);
 if(ing<meta*0.7&&t.slice(8)>'20')alerts.push(['warn','Cierras bajo tu meta','Quedan pocos días del mes.']);
 const free=[...Array(7)].reduce((s,_,i)=>s+freeWindows(addDays(t,i)).reduce((x,w)=>x+(w[1]-w[0]),0),0)/60;
 alerts.push(['ok','Publica tu disponibilidad',`Tienes ~${Math.round(free)} horas libres esta semana.`]);
 return `${back('Hoy','#/hoy')}${header('Ventas de servicios',cap(MESES[new Date().getMonth()])+' · todo se calcula desde tus cotizaciones, visitas y cobros')}
 <div class="col"><section class="row" style="flex-wrap:wrap;align-items:stretch">

 <div class="card" style="flex:1;min-width:150px"><span class="xs mut">Tasa de cierre</span><b style="font-family:'Cormorant Garamond',serif;font-size:36px;display:block">${tasa} %</b><span class="xs mut">${acc} de ${qs.length} cotizaciones</span></div>
 <div class="card" style="flex:1;min-width:150px"><span class="xs mut">Ocupación</span><b style="font-family:'Cormorant Garamond',serif;font-size:36px;display:block">${ocup} %</b><span class="xs mut">de tus horas del mes</span></div>
 <div class="card" style="flex:1;min-width:150px"><span class="xs mut">Valor por hora trabajada</span><b style="font-family:'Cormorant Garamond',serif;font-size:36px;display:block">${clp(vph)}</b><span class="xs mut">incluye traslados</span></div></section>
 <section class="card" aria-label="Ingresos por semana"><b>Ingresos por semana</b> <span class="xs mut">cobrado vs. por cobrar</span>
 <div class="row" style="align-items:flex-end;height:160px;margin-top:10px;gap:14px">${wk.map((w,i)=>`<div class="grow col" style="gap:0;justify-content:flex-end;height:100%;align-items:center"><div style="width:100%;max-width:60px;display:flex;flex-direction:column;justify-content:flex-end;height:130px"><div style="height:${Math.round(w.c/mx*130)}px;background:var(--amber);border-radius:6px 6px 0 0"></div><div style="height:${Math.round(w.p/mx*130)}px;background:var(--ok);${w.c?'':'border-radius:6px 6px 0 0'}"></div></div><b class="xs">Sem ${i+1}</b><span class="xs mut">${clp(w.p+w.c)}</span></div>`).join('')}</div>
 <div class="row xs mut"><span class="row" style="gap:6px"><i style="width:10px;height:10px;background:var(--ok);border-radius:2px"></i>Cobrado</span><span class="row" style="gap:6px"><i style="width:10px;height:10px;background:var(--amber);border-radius:2px"></i>Por cobrar</span></div></section>
 <section class="card col"><b>De dónde llegan</b>${Object.entries(srcs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="row sp sm"><span>${esc(k)}</span><b>${v}</b></div><div class="bar"><i style="width:${Math.round(v/smax*100)}%;background:var(--amber)"></i></div></div>`).join('')||'<span class="sm mut">Aún sin datos</span>'}</section>
 <section class="col">${alerts.map(a=>`<div class="alert a-${a[0]}"><b>${a[1]}.</b><br>${a[2]}</div>`).join('')}</section></div>`;
};

function dispWeek(){
 const t=today();const wd=(pISO(t).getDay()+6)%7;let ws=addDays(t,7-wd);
 if(S.ui.dispThis)ws=addDays(t,-wd);
 return [...Array(6)].map((_,i)=>{const dt=addDays(ws,i);const w=freeWindows(dt);return {date:dt,w}});

let recog=null;
function dictate(targetSel,cb){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Tu navegador no dicta por voz');return}
 if(recog){try{recog.stop()}catch(e){}recog=null;return}
 recog=new SR();recog.lang='es-CL';recog.interimResults=false;recog.maxAlternatives=1;
 recog.onresult=e=>{const txt=e.results[0][0].transcript;cb(txt)};
 recog.onerror=e=>{toast(e.error==='not-allowed'?'Permite el micrófono para dictar':'No te escuché bien, intenta de nuevo')};
 recog.onend=()=>{recog=null;const b=$('#micbtn');if(b)b.style.outline=''};
 try{recog.start();const b=$('#micbtn');if(b)b.style.outline='3px solid var(--bad)'}catch(e){recog=null}
}

}

 const kind=f.dataset.form;const o=Object.fromEntries(new FormData(f));const box=f.querySelector('#confbox');
 const bad=m=>{if(box)box.innerHTML=`<div class="alert a-bad" role="alert">${m}</div>`};
 switch(kind){
 case 'appt':saveAppt(f,false);break;
 case 'phrase':if(!o.txt.trim()){toast('Escribe o dicta una frase');break}usePhrase(o.txt);break;
 case 'pat':{if(!o.name.trim())return bad('Falta el nombre.');
  const risks=o.risks.split(',').map(x=>x.trim()).filter(Boolean);
  const data={name:o.name.trim(),age:Number(o.age)||0,zone:o.zone.trim(),svc:o.svc,source:o.source,resp:{name:o.rname.trim(),rel:o.rrel.trim(),phone:o.rphone.trim()},risks,notes:o.notes.trim()};
  if(o.id){const p=P(o.id);Object.assign(p,data);p.indication=Object.assign(p.indication||{},{text:o.ind.trim()})}
  else{S.patients.push(Object.assign({id:uid(),consent:null,phase:'consulta',indication:{text:o.ind.trim(),date:today()}},data))}
  save();closeSheet();toast('Paciente guardada');route();break}
 case 'visit':closeVisit(f);break;
 case 'boleta':{const c=S.charges.find(x=>x.id===f.dataset.id);const n=o.n.trim();if(!/^\d+$/.test(n)){toast('El N° debe ser numérico');break}c.boleta=n;if(!/^Boleta N°/.test(c.concept))c.concept='Boleta N° '+n+' · '+c.concept;S.counters.boleta=Math.max(S.counters.boleta,Number(n));save();closeSheet();route();toast('Boleta registrada');break}
 case 'charge':{if(!o.patientId||!o.concept.trim()||!(Number(o.amount)>0))return bad('Completa paciente, concepto y monto.');S.charges.push({id:uid(),patientId:o.patientId,concept:o.concept.trim(),amount:Number(o.amount),due:o.due,status:'pend',boleta:''});save();closeSheet();route();toast('Cobro creado');break}
 case 'quote':{syncQuote(f,false);const d=S.ui.qdraft;
  if(!d.patientId)return bad('Elige la paciente.');if(!d.servicio.trim())return bad('Describe el servicio.');if(!(d.qty>0)||!(d.unit>=0))return bad('Revisa cantidad y valor.');
  const p=P(d.patientId);S.counters.quote++;
  const q={id:uid(),n:pad4(S.counters.quote),patientId:d.patientId,resp:p.resp.name,modo:d.modo,servicio:d.servicio.trim(),qty:d.qty,unit:d.unit,disc:d.disc,zone:d.zone,valid:d.valid,status:'borrador',date:today(),dur:d.dur,slots:tentSlots(d)};
  S.quotes.push(q);S.ui.qdraft=null;save();location.hash='#/cotizacion/'+q.id;break}
 case 'lead':{if(!o.name.trim())return bad('Falta el nombre.');const data={name:o.name.trim(),need:o.need.trim(),source:o.source,amount:Number(o.amount)||0,stage:Number(o.stage),note:o.note.trim()};if(o.id)Object.assign(S.leads.find(l=>l.id===o.id),data);else S.leads.push(Object.assign({id:uid()},data));save();closeSheet();route();break}
 case 'settings':{
  Object.assign(S.profile,{name:o.name.trim()||S.profile.name,reg:o.reg.trim(),rut:o.rut.trim(),wa:o.wa.trim(),email:o.email.trim(),ig:o.ig.trim(),bank:o.bank.trim(),meta:Number(o.meta)||0});
  Object.assign(S.tarifas,{visita:Number(o.visita)||0,turnoHora:Number(o.turnoHora)||0,pack:Number(o.pack)||0});
  const dias=new FormData(f).getAll('dias').map(Number);
  if(toMin(o.fin)<=toMin(o.ini))return bad('El horario de término debe ser posterior al de inicio.');
  Object.assign(S.horario,{ini:o.ini,fin:o.fin,almIni:o.almIni,almFin:o.almFin,dias});save();toast('Ajustes guardados');break}
 }
});

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=()=>res('');im.src=r.result};r.readAsDataURL(file)})}
