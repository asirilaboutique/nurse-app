<!--evo-->
<style id="evoCss">
.modes{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 88%,transparent)}
.modes{justify-content:flex-start!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.modes::-webkit-scrollbar{display:none}.modes>*{flex:none;white-space:nowrap}
.modes a{font:inherit;font-size:14px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center}
.modes button{border-radius:99px}
#evoDash{margin:6px 0 4px}
.evoHero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;background:linear-gradient(150deg,#1F3A8F,#14275F 58%,#0C1A44);color:#fff;box-shadow:0 18px 40px rgba(20,39,95,.28)}
.evoHero svg.ecg{position:absolute;left:0;right:0;top:26px;width:100%;height:80px;opacity:.14;pointer-events:none}
.evoTop{position:relative;display:flex;gap:16px;align-items:center}
.evoRing{flex:none;width:104px;height:104px;position:relative}
.evoRing svg{width:104px;height:104px;transform:rotate(-90deg)}
.evoRing b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 26px var(--body);line-height:1}
.evoRing b small{font:600 11px var(--body);letter-spacing:.14em;color:#9FD9CF;margin-top:3px}
.evoTxt{min-width:0}
.evoTxt .e1{font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:#9FD9CF}
.evoTxt h2{margin:4px 0 2px;font:600 30px/1.05 var(--display);color:#fff}
.evoTxt .e2{font-size:14px;color:#CFE0F2}
.evoSets{position:relative;display:flex;flex-direction:column;gap:9px;margin:16px 0 4px}
.evoSet{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;color:#DCE8F6}
.evoSet i{grid-column:1/-1;display:block;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.evoSet i u{display:block;height:100%;border-radius:5px;background:var(--c);transition:width .6s}
.evoSet b{font-variant-numeric:tabular-nums}
.evoGo{position:relative;display:block;width:100%;margin-top:14px;font:700 17px var(--body);color:#fff;background:#B2593F;border:0;border-radius:16px;padding:15px 16px;min-height:54px;cursor:pointer;text-align:center}
.evoGo small{display:block;font:500 12.5px var(--body);color:#FBE3DA;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evoGo[disabled]{background:#2E7D5B}
.evoRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative}
.evoRow button{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.evoPre{margin:12px 0 0;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px}
.evoPre summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.evoPre label{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px}
.evoPre input{width:22px;height:22px;accent-color:var(--acc)}
#evoMsg{font-size:13px;color:#9FD9CF;position:relative;min-height:18px;margin-top:6px}
.evoSplash{position:fixed;inset:0;z-index:99;background:radial-gradient(120% 90% at 50% 45%,#1B3578 0%,#14275F 55%,#0C1A44 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;animation:evoOut .55s 3.1s forwards;overflow:hidden}
.evoSplash canvas{position:absolute;inset:0;width:100%;height:100%;animation:evoFade .6s 1.35s forwards}
.evoSplash .sg{position:absolute;inset:0;background-image:linear-gradient(rgba(159,217,207,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(159,217,207,.06) 1px,transparent 1px);background-size:28px 28px;opacity:0;animation:evoIn .8s .1s forwards}
.evoSplash .lg{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:translateY(8px) scale(.96);animation:evoLg .9s 1.55s cubic-bezier(.2,.8,.2,1) forwards}
.evoSplash .nm{font:600 40px/1 var(--display);color:#fff}
.evoSplash .rl{font:700 11px var(--body);letter-spacing:.32em;text-transform:uppercase;color:#9FD9CF}
.evoSplash .tl{position:relative;font:italic 500 22px var(--display);color:#E3EEF9;text-align:center;opacity:0;animation:evoIn .8s 2.15s forwards}
@keyframes evoIn{to{opacity:1}}@keyframes evoFade{to{opacity:0}}@keyframes evoLg{to{opacity:1;transform:none}}@keyframes evoOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.evoSplash canvas,.evoSplash .sg{display:none}.evoSplash .lg,.evoSplash .tl{animation-delay:0s;animation-duration:.2s}.evoSplash{animation-delay:1.2s}}
</style>
